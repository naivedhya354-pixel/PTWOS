<style>
:root{--bg:#F1F5EF;--card:#fff;--ink:#17302A;--mut:#5B6F68;--g:#1F4D3A;--w:#1E6B7A;--o:#C9871A;--line:#D9E3DC;--bad:#B3361F}
@media(prefers-color-scheme:dark){:root{--bg:#0F1A16;--card:#18271F;--ink:#E6EFE9;--mut:#9DB2A8;--line:#2B3F35;--g:#7FC7A0;--w:#6FC1D0;--o:#E8B04F}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:0 14px 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.brand{font-family:Fraunces,Mukta,serif;font-weight:700;font-size:17px;color:var(--g);line-height:1.1}
.brand small{display:block;font:600 11px Mukta;color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;background:var(--g);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.dark-text .btn{color:#10201A}
.btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.sm{width:auto;padding:6px 12px;margin:0;font-size:14px}
.lang{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;cursor:pointer;font-weight:600}
h1{font-size:22px;margin:10px 0 4px}h2{font-size:18px;margin:16px 0 6px}
.mut{color:var(--mut);font-size:14px}
.hero{border-radius:18px;padding:20px 18px;color:#fff;margin:10px 0;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.hero b{font-size:21px;line-height:1.2}.hero span{font-size:14px;opacity:.92;margin-top:4px}
.hero.w{background:linear-gradient(150deg,#1E6B7A,#123F4A)}
.hero.o{background:linear-gradient(150deg,#C9871A,#7A4E0B)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:5px 12px;font-size:14px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:600;font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin-top:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{font-weight:600;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;max-width:520px;width:100%}
nav a{flex:1;text-align:center;padding:9px 0;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
nav a.on{color:var(--g)}nav a i{display:block;font-style:normal;font-size:19px}
.price{font-weight:800;font-size:18px}.mrp{text-decoration:line-through;color:var(--mut);font-size:14px;margin-left:6px}
.note{background:#FFF4DC;color:#5A3E05;border-radius:10px;padding:10px;font-size:13px;margin:10px 0}
.warn{background:#FBE4DE;color:#7A2414}
.step{display:flex;gap:6px;margin:10px 0}.step i{flex:1;height:6px;border-radius:3px;background:var(--line)}.step i.on{background:var(--g)}
.tag{font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
@media(prefers-color-scheme:dark){#toast{background:#E6EFE9;color:#0F1A16}}
.eye{position:absolute;right:6px;top:calc(50% + 2px);transform:translateY(-50%);background:none;border:0;color:var(--g);font-weight:600;padding:8px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:9}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}

/* ===== THEMES: sage = "Fresh Sage" (soft green, floating pill nav) | mint = "Green Healer" (glass + gradient) ===== */
.hero{position:relative;overflow:hidden}
.hero::after{content:'🌿';position:absolute;right:14px;top:6px;font-size:68px;opacity:.9;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.hero.o::after{content:'🌾'}
.hdr-r{display:flex;gap:8px}
:root[data-theme]{color-scheme:light}
:root[data-theme] body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
:root[data-theme] nav{background:transparent;border:0;pointer-events:none;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
:root[data-theme] nav div{pointer-events:auto;background:var(--card);border-radius:32px;padding:6px;gap:2px;box-shadow:0 10px 30px rgba(20,60,35,.18)}
:root[data-theme] nav a{border-radius:26px;padding:8px 0}
:root[data-theme] #toast{background:var(--ink);color:#fff}
:root[data-theme] .lang{min-width:42px;text-align:center}

/* --- Theme 1: Fresh Sage --- */
:root[data-theme=sage]{--bg:#E8F1E5;--card:#fff;--ink:#14231A;--mut:#64796A;--g:#2D6A34;--w:#2D6A34;--o:#8DAA7E;--line:#DCE8D8}
:root[data-theme=sage] body{background:var(--bg)}
:root[data-theme=sage] .brand{color:#1E4D26}
:root[data-theme=sage] h1{font-size:25px;font-weight:800;letter-spacing:-.2px}
:root[data-theme=sage] .btn{background:#A3BF97;color:#10301A;border-radius:16px;padding:13px 16px}
:root[data-theme=sage] .btn.sm{padding:6px 12px}
:root[data-theme=sage] .btn.alt{background:transparent;color:var(--g);border:1.5px solid #A3BF97}
:root[data-theme=sage] .card,:root[data-theme=sage] .tile{border:0;border-radius:22px;box-shadow:0 8px 22px rgba(46,90,50,.08)}
:root[data-theme=sage] .hero{border-radius:26px;min-height:170px}
:root[data-theme=sage] .hero.w{background:linear-gradient(150deg,#D5E8CE,#A8C99D);color:#12301A}
:root[data-theme=sage] .hero.o{background:linear-gradient(150deg,#E6EDCB,#BCD08F);color:#2B3A12}
:root[data-theme=sage] .hero span{opacity:.8}
:root[data-theme=sage] nav a.on{background:#A3BF97;color:#10301A}
:root[data-theme=sage] .chip{background:#EEF5EB;border:0}
:root[data-theme=sage] .lang{border:0;box-shadow:0 4px 12px rgba(46,90,50,.12)}
:root[data-theme=sage] input,:root[data-theme=sage] select,:root[data-theme=sage] textarea{border-radius:14px;background:#F6FAF4}
:root[data-theme=sage] .step i.on{background:#7FA26F}

/* --- Theme 2: Green Healer --- */
:root[data-theme=mint]{--bg:#C9F2BE;--card:rgba(255,255,255,.58);--ink:#1D2B24;--mut:#3F5A4C;--g:#1F5C45;--w:#1F5C45;--o:#2E8B63;--line:rgba(31,60,45,.14)}
:root[data-theme=mint] body{background:linear-gradient(165deg,#7FE8C4 0%,#C9F3A8 38%,#EBF7A5 58%,#A6EDB0 80%,#74DDA0 100%);background-attachment:fixed;min-height:100vh}
:root[data-theme=mint] .brand{font-size:22px;color:#1D2B24}
:root[data-theme=mint] h1,:root[data-theme=mint] h2{font-family:Fraunces,Mukta,serif}
:root[data-theme=mint] h1{font-size:28px;letter-spacing:-.3px}
:root[data-theme=mint] .btn{background:#23362D;color:#fff;border-radius:16px;padding:13px 16px;box-shadow:0 8px 18px rgba(20,50,35,.22)}
:root[data-theme=mint] .btn.sm{padding:6px 12px}

:root[data-theme=mint] .card,:root[data-theme=mint] .tile,:root[data-theme=mint] .chip,:root[data-theme=mint] .lang,:root[data-theme=mint] nav div,:root[data-theme=mint] .hero{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-theme=mint] .card,:root[data-theme=mint] .tile{border:1px solid rgba(255,255,255,.75);border-radius:22px;box-shadow:0 10px 28px rgba(25,90,60,.12)}
:root[data-theme=mint] .hero{border-radius:28px;min-height:170px;border:1px solid rgba(255,255,255,.8);color:#1D2B24}
:root[data-theme=mint] .hero.w{background:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.28))}
:root[data-theme=mint] .hero.o{background:linear-gradient(150deg,rgba(255,244,170,.8),rgba(255,255,255,.3))}
:root[data-theme=mint] .hero span{opacity:.85}
:root[data-theme=mint] nav a.on{background:#fff;color:var(--g);box-shadow:0 4px 10px rgba(20,60,40,.12)}
:root[data-theme=mint] .chip{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.9)}
:root[data-theme=mint] .lang{border-color:rgba(255,255,255,.9)}
:root[data-theme=mint] input,:root[data-theme=mint] select,:root[data-theme=mint] textarea{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9);border-radius:14px}
:root[data-theme=mint] .step i{background:rgba(255,255,255,.7)}
:root[data-theme=mint] .step i.on{background:#1F5C45}

:root[data-theme=mint] .warn{background:rgba(251,228,222,.92)}

.arow{padding:10px 0;border-bottom:1px solid var(--line)}.arow:last-child{border:0}.arow .nm{font-weight:600;word-break:break-word}.acts{display:flex;gap:6px;margin-top:8px;align-items:center}
.acts .btn.sm,:root[data-theme] .acts .btn.sm{flex:1;width:auto;padding:7px 4px;margin:0;font-size:13px}
.acts select{flex:2;margin:0}.acts .btn.del,:root[data-theme] .acts .btn.del{color:var(--bad);border-color:var(--bad)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal img{flex:0 0 100%;width:100%;aspect-ratio:1;object-fit:cover;scroll-snap-align:center}

/* ===== THEME: ptows = "PTOWS Gold" (logo colours: deep green + gold) ===== */
:root[data-theme=ptows]{color-scheme:dark;--bg:#04150B;--card:#0F2E1F;--ink:#F6EBCB;--mut:#B4C7B8;--g:#E8B94A;--w:#E8B94A;--o:#E8B94A;--line:rgba(232,185,74,.26);--bad:#FF8A72}
:root[data-theme=ptows] body{background:radial-gradient(120% 55% at 50% 0%,#14402B 0%,#04150B 62%) fixed,#04150B}
:root[data-theme=ptows] h1,:root[data-theme=ptows] h2{font-family:Fraunces,Mukta,serif;color:#F3D283}
:root[data-theme=ptows] h1{font-size:26px;letter-spacing:-.2px}
:root[data-theme=ptows] .price{color:#F3D283}
:root[data-theme=ptows] .btn{background:linear-gradient(180deg,#F3D283,#D2A038);color:#10240F;border-radius:16px;padding:13px 16px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.4)}
:root[data-theme=ptows] .btn.sm{padding:6px 12px}
:root[data-theme=ptows] .btn.alt{background:transparent;color:var(--g);border:1.5px solid var(--g);box-shadow:none}
:root[data-theme=ptows] .btn:disabled{opacity:.45}
:root[data-theme=ptows] .card,:root[data-theme=ptows] .tile{background:var(--card);border:1px solid rgba(232,185,74,.3);border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
:root[data-theme=ptows] .hero{border-radius:26px;min-height:170px;border:1px solid rgba(232,185,74,.45)}
:root[data-theme=ptows] .hero.w{background:linear-gradient(150deg,#1D5A3E,#0A2A1A);color:#F6EBCB}
:root[data-theme=ptows] .hero.o{background:linear-gradient(150deg,#F3D283,#BC8A22);color:#2A1D03}
:root[data-theme=ptows] .hero span{opacity:.9}
:root[data-theme=ptows] nav div{background:var(--card);border:1px solid rgba(232,185,74,.35)}
:root[data-theme=ptows] nav a.on{background:linear-gradient(180deg,#F3D283,#D2A038);color:#10240F}
:root[data-theme=ptows] .chip{background:rgba(255,255,255,.06);border:1px solid rgba(232,185,74,.32);color:var(--ink)}
:root[data-theme=ptows] .chip[style*="var(--g)"]{color:#10240F!important;font-weight:700}
:root[data-theme=ptows] .lang{background:var(--card);border:1px solid rgba(232,185,74,.45);color:var(--g)}
:root[data-theme=ptows] input,:root[data-theme=ptows] select,:root[data-theme=ptows] textarea{background:#0A2417;border:1px solid rgba(232,185,74,.32);border-radius:14px;color:var(--ink)}
:root[data-theme=ptows] .step i{background:rgba(255,255,255,.16)}
:root[data-theme=ptows] .step i.on{background:var(--g)}
:root[data-theme=ptows] .note{background:rgba(232,185,74,.14);color:#F6EBCB}
:root[data-theme=ptows] .warn{background:rgba(255,138,114,.16);color:#FFCFC3}
:root[data-theme=ptows] .tag{background:rgba(232,185,74,.2);color:#F3D283}
:root[data-theme=ptows] #toast{background:var(--g);color:#10240F}
#splash #sb{display:none}
#splash .fg{height:100%;object-fit:contain}@media(min-aspect-ratio:941/1672){#splash .fg{object-fit:cover}}
/* video box in product page */
.vid{display:block;width:100%;max-height:60vh;border-radius:16px;margin-top:10px;background:#000}

nav div{max-width:660px}
header{padding:18px 0}
.brand{font-size:21px}.brand small{font-size:12px}
:root[data-theme] h1{font-size:28px}
h2{font-size:20px}

#app[data-v=login]{max-width:560px}
#app[data-v=diet]{max-width:820px}
#app[data-v=diet] form.card{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;padding:20px}

#app[data-v=home]{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
#app[data-v=home]>*{grid-column:1/-1;margin-top:0;margin-bottom:0}
#app[data-v=home]>.hero{grid-column:span 1;min-height:250px;padding:26px 24px}
#app[data-v=home] .hero b{font-size:27px}
#app[data-v=home] .hero span{font-size:16px}
#app[data-v=home] .grid2{grid-template-columns:repeat(4,1fr);gap:12px}
#app[data-v=home] .tile{padding:18px 12px}
.hero::after{font-size:84px}
#app[data-v=shop],#app[data-v=kits],#app[data-v=dis],#app[data-v=docs]{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-content:start}
#app[data-v=shop]>*,#app[data-v=kits]>*,#app[data-v=dis]>*,#app[data-v=docs]>*{grid-column:1/-1}
#app[data-v=shop]>.card,#app[data-v=kits]>.card,#app[data-v=dis]>.card,#app[data-v=docs]>.card{grid-column:auto;margin:0}
#app[data-v=shop] .tn{width:84px;height:84px}
#app[data-v=prod],#app[data-v=kit]{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;row-gap:0;align-content:start}

#app[data-v=prod]>a.mut,#app[data-v=kit]>a.mut{margin-bottom:12px}
#app[data-v=prod]>.media,#app[data-v=kit]>.media{grid-column:1;grid-row:3/span 12;position:sticky;top:14px;align-self:start}
#app[data-v=prod]:not(:has(.media))>*,#app[data-v=kit]:not(:has(.media))>*{grid-column:1/-1}
#app[data-v=prod]:not(:has(.media)),#app[data-v=kit]:not(:has(.media)){max-width:720px}
#app[data-v=admin]{max-width:1000px}
#app[data-v=admin] form{max-width:680px}
}
@media(min-width:1100px){
#app{max-width:1180px;padding:0 40px 32px}
body{font-size:17px}
nav div{max-width:720px}
#app[data-v=home]>.hero{min-height:300px}
#app[data-v=home] .hero b{font-size:32px}
#app[data-v=prod],#app[data-v=kit]{column-gap:56px}
#app[data-v=admin]{max-width:1100px}
}

if(m=s.match(/^(.*) · P&L$/))return m[1]+' · लाभ-हानि';
if(m=s.match(/^(.*) · stock (\d+)$/))return m[1]+' · स्टॉक '+m[2];
if(m=s.match(/^(.*) · inactive$/))return m[1]+' · बंद';
if(m=s.match(/^Report: (.*)$/))return 'रिपोर्ट: '+m[1];
if(m=s.match(/^Category: (.*)$/))return 'कैटेगरी: '+m[1];
if(m=s.match(/^Product: (.*)$/))return 'प्रोडक्ट: '+m[1];
if(m=s.match(/^Delivered order sales \(info only, all time\): (.*)$/))return 'डिलीवर हुए ऑर्डर की बिक्री (सिर्फ जानकारी, कुल): '+m[1];
if(m=s.match(/^(.+?) off · (.+?) · (.+?) → (.+?) · (LIVE|scheduled \/ expired|off)$/)){const st={'LIVE':'चालू','scheduled / expired':'शेड्यूल्ड / समाप्त','off':'बंद'}[m[5]],tg=AHI[m[2]]||ahP(m[2]),w=x=>x=='now'?'अभी':x=='no end'?'कोई अंत नहीं':x;return m[1]+' छूट · '+tg+' · '+w(m[3])+' → '+w(m[4])+' · '+st}
return s}

function adminHi(root){if(S.lang!='hi'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode())L.push(n);
L.forEach(n=>{const p=n.parentElement;if(!p||/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.tagName))return;const raw=n.nodeValue,t=raw.trim(),k=t.replace(/\s+/g,' ');if(!k)return;

function dS(i){if(!confirm('Delete login?'))return;if(!FB){S.staff.splice(i,1);save();return draw()}db.collection('staff').doc(S.staff[i].uid).delete().then(()=>toast('Access removed')).catch(e=>toast(e.code))}
/* catalog is split: config/meta (small settings) + one document per product / kit / disease (collections: products, kits, diseases) */
const CC=['products','kits','diseases'],LAST={products:{},kits:{},diseases:{},meta:''},RDY={};let LEG=null;
const metaOf=()=>({cats:S.cats,pcats:S.pcats,branches:S.branches,offers:S.offers,qs:S.qs,baseUrl:S.baseUrl||''});
function catSave(){if(!catReady||!db)return;const ops=[];
CC.forEach(c=>{const cur={};S[c].forEach((x,i)=>{if(x.ord==null)x.ord=Date.now()+i;cur[x.id]=JSON.stringify(x);if(LAST[c][x.id]!==cur[x.id])ops.push(b=>b.set(db.collection(c).doc(String(x.id)),clean(x)))});
Object.keys(LAST[c]).forEach(id=>{if(!(id in cur))ops.push(b=>b.delete(db.collection(c).doc(id)))});LAST[c]=cur});
const m=JSON.stringify(metaOf());if(m!==LAST.meta){ops.push(b=>b.set(db.doc('config/meta'),clean(metaOf())));LAST.meta=m}
for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));b.commit().catch(e=>toast(e.code))}}
function catChecked(){if(catReady||!(RDY.meta&&RDY.products&&RDY.kits&&RDY.diseases&&RDY.leg))return;catExists=RDY.hasNew?1:0;if(!catExists&&LEG)Object.assign(S,LEG);catReady=1;if(!catExists&&S.staffUser?.role=='super')catSave();rd()}
function catSnap(c,sn){if(sn.metadata.hasPendingWrites)return;const L=sn.docs.map(x=>x.data()).sort((a,b)=>(a.ord||0)-(b.ord||0));if(L.length)RDY.hasNew=1;if(catReady||L.length){S[c]=L;LAST[c]=Object.fromEntries(L.map(x=>[x.id,JSON.stringify(x)]))}RDY[c]=1;catChecked();rd()}
function lgC(f){return FB?auth.signInWithEmailAndPassword(f.m.value+'@ptwos.app',f.p.value).catch(()=>toast(H('मोबाइल या पासवर्ड गलत है','Wrong mobile or password'))):lgC0(f)}
function lgS(f){return FB?auth.signInWithEmailAndPassword(f.i.value.trim().toLowerCase()+'@staff.ptwos.app',f.p.value).catch(()=>toast('Wrong ID or password')):lgS0(f)}
function rgC(f){if(!FB)return rgC0(f);if(f.p.value!=f.p2.value)return toast('Passwords do not match');regBusy=1;
auth.createUserWithEmailAndPassword(f.m.value+'@ptwos.app',f.p.value).then(async c=>{await db.collection('users').doc(c.user.uid).set(clean({name:f.n.value,mobile:f.m.value,email:f.e.value,city:f.c.value,pin:f.pin.value}));regBusy=0;onAuth(c.user)}).catch(e=>{regBusy=0;toast(e.code=='auth/email-already-in-use'?H('यह मोबाइल पहले से रजिस्टर है','Mobile already registered'):e.message)})}
function cpw(f){if(!FB)return cpw0(f);const u=auth.currentUser;u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,f.o.value)).then(()=>u.updatePassword(f.n.value)).then(()=>{toast('Password updated ✓');f.reset()}).catch(e=>toast(/password|credential/.test(e.code)?'Current password is wrong':e.message))}
async function aS(f){if(!FB)return aS0(f);const id=f.i.value.trim().toLowerCase();try{const c=await sec.auth().createUserWithEmailAndPassword(id+'@staff.ptwos.app',f.p.value);await db.collection('staff').doc(c.user.uid).set({id,name:f.n.value,role:'branch',branch:f.b.value});await sec.auth().signOut();toast('Login created ✓');f.reset()}catch(e){toast(e.code=='auth/email-already-in-use'?'Login ID already exists':e.message)}}
function rp(i){if(!FB)return rp0(i);toast('Password reset: Firebase Console > Authentication, or delete and recreate this login')}
function watch(st){const q=c=>{let r=db.collection(c);r=st?(st.role=='super'?r:r.where('branch','==',st.branch)):r.where('uid','==',auth.currentUser.uid);
subs.push(r.onSnapshot(sn=>{S[c]=sn.docs.map(x=>({...x.data(),_id:x.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));rd()},e=>toast(c+': '+e.code)))};
['orders','appts','records','diets',...(st&&st.role=='super'?['pl']:[])].forEach(q);
if(st&&st.role=='super')subs.push(db.collection('staff').onSnapshot(sn=>{S.staff=sn.docs.map(x=>({...x.data(),uid:x.id}));rd()}))}
async function onAuth(u){if(regBusy)return;subs.forEach(f=>f());subs=[];['orders','appts','records','diets','pl'].forEach(c=>S[c]=[]);
if(!u){S.user=null;S.staffUser=null;return draw()}
if(catErr){catErr=0;catWatch()}
try{const st=await db.collection('staff').doc(u.uid).get();
if(st.exists){const d=st.data();S.staffUser={id:d.id,name:d.name,role:d.role,branch:d.branch,uid:u.uid};S.user=null;watch(d);if(d.role=='super'&&catReady&&!catExists)catSave();go('admin','od')}
else{const us=await db.collection('users').doc(u.uid).get();if(!us.exists){toast('Account not found');return auth.signOut()}S.user={...us.data(),uid:u.uid};S.staffUser=null;watch(null);after()}
}catch(e){toast('Error: '+e.code)}}
let catUn=[],catErr=0;function catWatch(){catUn.forEach(f=>f());catUn=[];
catUn.push(db.doc('config/meta').onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;if(sn.exists){RDY.hasNew=1;Object.assign(S,sn.data());LAST.meta=JSON.stringify(metaOf())}RDY.meta=1;catChecked();rd()},e=>{catErr=1;toast('meta: '+e.code)}));
CC.forEach(c=>catUn.push(db.collection(c).onSnapshot(sn=>catSnap(c,sn),e=>{catErr=1;toast(c+': '+e.code)})))}
if(FB){S.staff=[];S.users=[];firebase.initializeApp(FBCFG);auth=firebase.auth();db=firebase.firestore();sec=firebase.initializeApp(FBCFG,'sec');
catWatch();
db.doc('config/catalog').get().then(sn=>{if(sn.exists)LEG=sn.data()}).catch(()=>{}).then(()=>{RDY.leg=1;catChecked()});
auth.onAuthStateChanged(onAuth)}


/* ===== Barcode / QR labels + public product page (scan -> full details) ===== */
var SCAN=null,SCS=null;
const fmtD=d=>d?String(d).split('-').reverse().join('/'):'',bme=o=>[o.bt&&'Batch: '+o.bt,o.mf&&'MFG: '+fmtD(o.mf),o.ex&&'EXP: '+fmtD(o.ex)].filter(Boolean).join(' · ');
const exSt=e=>{if(!e)return null;const n=Math.ceil((new Date(e+'T23:59:59')-Date.now())/864e5);return n<0?['#B3361F',H('एक्सपायर हो चुका','Expired')]:n<=30?['#C9871A',H('जल्द एक्सपायर ('+n+' दिन)','Expiring soon ('+n+' days)')]:['#1B7F3B',H('वैध','Valid')]};
const baseU=()=>(S.baseUrl||location.href).split('#')[0],itemURL=(t,id)=>baseU()+'#item/'+t+'/'+id,codeOf=(t,id)=>'PT-'+String(id).toUpperCase();
function qrSvg(txt){if(typeof qrcode=='undefined')return '<div class="mut">QR library load nahi hui (internet check karein)</div>';try{const q=qrcode(0,'M');q.addData(txt);q.make();const n=q.getModuleCount(),m=2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+','+(r+m)+'h1v1h-1z';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}}
function bc128(code){if(typeof JsBarcode=='undefined')return '';try{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');JsBarcode(s,code,{format:'CODE128',displayValue:true,height:40,width:2,margin:4,fontSize:13,background:'#fff'});return s.outerHTML}catch(e){return ''}}
const lbl=(t,o)=>`<div class="lbl"><b>PanchTatva</b><div class="ln">${esc(o.en)}</div><div class="qr">${qrSvg(itemURL(t,o.id))}</div><div class="bc">${bc128(codeOf(t,o.id))}</div><div class="lm">${esc(bme(o))}</div></div>`;
function bcOpen(h,ti,one){bcClose();const w=location.protocol=='file:'&&!S.baseUrl?'<div class="note warn nopr">Abhi app local file se khula hai. Barcode scan par details tabhi khulengi jab "Branches & Staff" tab me apni live website ka link save karenge.</div>':'',d=document.createElement('div');d.id='bco';d.innerHTML=`<div class="bcb"><div class="row nopr"><b>${esc(ti)}</b><button class="btn sm alt" onclick="bcClose()">✕</button></div>${w}${h}<div class="nopr"><button class="btn" onclick="print()">🖨 Print / Save PDF</button>${one?'<button class="btn alt" onclick="bcDl()">Download QR (SVG)</button>':''}</div></div>`;document.body.appendChild(d)}
function bcClose(){const d=document.getElementById('bco');d&&d.remove()}
function bcShow(t,i){const o=t=='k'?S.kits[i]:S.products[i];bcOpen(lbl(t,o),o.en,1)}
function bcAll(){bcOpen('<div class="lg">'+S.products.map(p=>lbl('p',p)).join('')+S.kits.map(k=>lbl('k',k)).join('')+'</div>','All barcode labels')}
function bcDl(){const s=document.querySelector('#bco .qr svg');if(!s)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s.outerHTML],{type:'image/svg+xml'}));a.download='qr.svg';a.click()}
V.item=(t,id)=>{const o=t=='k'?kit(id):pd(id);if(!o)return back("'home'")+`<div class="card mut">${FB&&!catReady?H('लोड हो रहा है…','Loading…'):H('प्रोडक्ट नहीं मिला','Product not found')}</div>`;
const f=(l,v)=>v?`<details open><summary>${l}</summary><p class="mut">${esc(v)}</p></details>`:'',s=exSt(o.ex),
rows=[[H('बैच नंबर','Batch no.'),o.bt],[H('निर्माण तिथि','Manufacturing date'),fmtD(o.mf)],[H('एक्सपायरी तिथि','Expiry date'),fmtD(o.ex)]].filter(r=>r[1]).map(r=>`<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join(''),
price=t=='k'?inr(o.price):o.vars.map(v=>v.s+' — '+inr(ep(o,v).price)).join(' · ');
const body=t=='k'?KS.map(l=>f(l,o[l])).join(''):f(H('विवरण','Description'),o.desc)+f(H('सामग्री (Ingredients)','Ingredients'),o.ing)+f(H('उत्पत्ति','Origin'),o.origin)+f(H('गुणवत्ता जानकारी','Quality information'),o.quality)+f(H('प्रोसेसिंग विवरण','Processing details'),o.process)+f(H('शेल्फ लाइफ और स्टोरेज','Shelf life & storage'),o.shelf);
return back("'home'")+gal(o)+`<h1>${nm(o)}</h1><span class="tag">✔ PanchTatva ${H('प्रोडक्ट विवरण','product details')}</span><div class="card"><div class="price">${esc(price)}</div>${s?`<div style="margin:8px 0"><span class="vbadge" style="background:${s[0]}">${s[1]}</span></div>`:''}${rows?`<table>${rows}</table>`:''}</div><div class="card">${body||'<div class="mut">—</div>'}</div>${t=='k'?`<div class="note">${tr('kitnote')}</div>`:''}<button class="btn" onclick="go('${t=='k'?'kit':'prod'}','${id}')">${H('खरीदें / कार्ट','Buy / Add to cart')}</button>`};
V.scan=()=>back("'home'")+`<h1>${H('प्रोडक्ट स्कैन करें','Scan product')}</h1><div class="card"><video id="sv" playsinline muted style="width:100%;border-radius:10px;display:none;background:#000"></video><button class="btn" onclick="scanStart()">${H('कैमरा खोलें','Open camera')}</button><div class="mut" id="sm"></div><label>${H('या कोड डालें','Or enter code')}<input id="sc" placeholder="PT-P0"></label><button class="btn alt" onclick="scanCode(document.getElementById('sc').value)">${H('खोजें','Find')}</button></div><div class="note">${H('फोन के कैमरा से QR स्कैन करने पर भी प्रोडक्ट की पूरी जानकारी खुल जाती है।','Scanning the QR with your phone camera also opens the full product details.')}</div>`;
async function scanStart(){const m=document.getElementById('sm');if(!('BarcodeDetector' in window)){m.textContent=H('इस ब्राउज़र में कैमरा स्कैन उपलब्ध नहीं। फोन के कैमरा से QR स्कैन करें या कोड डालें।','Camera scan not supported in this browser. Scan the QR with your phone camera or enter the code.');return}
try{const v=document.getElementById('sv');SCS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=SCS;v.style.display='block';await v.play();const det=new BarcodeDetector({formats:['qr_code','code_128']}),tick=async()=>{if(!SCS)return;try{const r=await det.detect(v);if(r.length){const x=r[0].rawValue;scanStop();return scanCode(x)}}catch(e){}setTimeout(tick,300)};tick()}catch(e){m.textContent=H('कैमरा चालू नहीं हो सका','Could not open camera')}}
function scanStop(){SCS&&SCS.getTracks().forEach(t=>t.stop());SCS=null}
function scanCode(raw){raw=String(raw||'').trim();const m=raw.match(/#item\/(p|k)\/([^\s#\/]+)/);let t,id;if(m){t=m[1];id=m[2]}else{id=raw.replace(/^PT-/i,'').toLowerCase();t=pd(id)?'p':kit(id)?'k':''}if(!t||!(t=='p'?pd(id):kit(id)))return toast(H('कोड नहीं मिला','Code not found'));go('item',t,id)}
{const hs=()=>{const m=location.hash.match(/^#item\/(p|k)\/([^\/\s]+)$/);return m?['item',m[1],decodeURIComponent(m[2])]:null},h0=hs();if(h0){SCAN={done:0,r:h0};S.guest=1;R=h0}
addEventListener('hashchange',()=>{const h=hs();if(h&&!S.staffUser){if(!S.user)S.guest=1;R=h;draw()}})}
Object.assign(AHI,{'Confirm':'कन्फर्म करें','Reject':'अस्वीकार करें','Pending':'पेंडिंग','Rejected':'अस्वीकृत','Concern':'समस्या','Requested on':'रिक्वेस्ट की तारीख','Diet type':'डाइट प्रकार','Barcode':'बारकोड','Print all labels':'सभी लेबल प्रिंट करें','Branch address':'ब्रांच का पता','Batch number':'बैच नंबर','Manufacturing date':'निर्माण तिथि','Expiry date':'एक्सपायरी तिथि','Ingredients':'सामग्री (Ingredients)','Barcode / QR link':'बारकोड / QR लिंक','App website link':'ऐप वेबसाइट लिंक','Save link':'लिंक सेव करें'});
{const f=document.querySelector('#splash .fg'),b=document.getElementById('sb');if(f&&b)b.src=f.src}
draw();
setTimeout(()=>{const sp=document.getElementById('splash');if(sp){sp.classList.add('hide');setTimeout(()=>sp.remove(),600)}},1800);
