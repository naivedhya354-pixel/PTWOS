.mut{color:var(--mut);font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:5px 12px;font-size:14px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:600;font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin-top:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{font-weight:600;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}

nav a{flex:1;text-align:center;padding:9px 0;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
nav a.on{color:var(--g)}nav a i{display:block;font-style:normal;font-size:19px}
.price{font-weight:800;font-size:18px}.mrp{text-decoration:line-through;color:var(--mut);font-size:14px;margin-left:6px}
.note{background:#FFF4DC;color:#5A3E05;border-radius:10px;padding:10px;font-size:13px;margin:10px 0}
.warn{background:#FBE4DE;color:#7A2414}

.tag{font-size:12px;background:var(--bg);border-radius:6px;padding:2px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}

function pv(i,id){const v=pd(id).vars[i];document.getElementById('pp').innerHTML=`<span class="price">${inr(v.p)}</span><span class="mrp">${inr(v.mrp)}</span>`}

function qty(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1);save();draw()}
function cT(){const sub=S.cart.reduce((a,x)=>a+ci(x).p*x.q,0),disc=S.coupon=='PANCH10'?Math.round(sub*.1):0,ship=sub-disc>=999?0:60;return{sub,disc,ship,tot:sub-disc+ship}}
function place(f){if(!need())return;const c=cT();!FB&&S.cart.forEach(x=>{if(x.t=='p'){pd(x.id).stock=Math.max(0,pd(x.id).stock-x.q)}});
put('orders',{id:uid().toUpperCase(),items:S.cart.map(x=>nm(ci(x).o)+' ×'+x.q),tot:c.tot,pay:f.pay.value,st:'Placed',date:new Date().toLocaleDateString(),name:f.n.value,addr:f.a.value,pin:f.pin.value,branch:f.br.value,mobile:S.user.mobile,phone:f.m.value});S.cart=[];S.coupon='';save();toast('Order placed ✓');go('orders')}
function sl(f){const taken=S.appts.filter(a=>a.date==f.d.value&&a.branch==f.l.value).map(a=>a.slot);document.getElementById('slots').innerHTML=SLOTS.map(s=>`<option ${taken.includes(s)?'disabled':''}>${s}${taken.includes(s)?' (booked)':''}</option>`).join('')}
function bk(f,did,dis){if(!need())return;put('appts',{mobile:S.user.mobile,patient:S.user.name,doctor:DOCS.find(x=>x.id==did).en,type:f.t.value,branch:f.l.value,loc:bn(f.l.value),date:f.d.value,slot:f.s.value.slice(0,5),concern:f.c.value});save();toast('Appointment confirmed ✓');go('acct')}
function dt(f){if(!need())return;;const lbl=[...f.querySelectorAll('label')].map(l=>l.firstChild.textContent);const o={};lbl.forEach((l,i)=>o[l]=f.elements['f'+i]?.value||'');o.Diet=f.v.value;o.branch=f.br.value;o.mobile=S.user.mobile;put('diets',o);toast('Request sent ✓');go('acct')}
function subQ(id,f){if(!need())return;;const a=qsOf(id).map((q,i)=>({q,a:f.elements['q'+i].value}));put('records',{mobile:S.user.mobile,branch:f.br.value,disease:dz(id).en,patient:S.user.name,answers:a,report:f.f.files[0]?.name||''});save();go('g',id)}
function lg(f){if(!pending){pending=1;draw();return}if(f.o.value!='1234')return toast('Wrong OTP');S.user={mobile:f.m.value,name:f.n.value,city:f.c.value,pin:f.p.value};pending=null;save();draw()}
function aD(f){const id=S.cats.length+'x'+uid(),d={id,cat:+f.c.value,en:f.n.value,kit:f.k.value,on:1,i0:f.i.value};S.diseases.push(d);save();toast('Disease added');draw()}
function aQ(f){(S.qs[f.d.value]=S.qs[f.d.value]||[]).push(f.q.value);save();toast('Question added');draw()}
function aP(f){S.products.push({id:'p'+uid(),cat:f.c.value,en:f.n.value,hi:'',vars:[{s:f.s.value,mrp:+f.m.value,p:+f.p.value}],stock:+f.t.value||0,on:1,desc:f.d.value});save();toast('Product added');draw()}
function lgC0(f){const u=S.users.find(x=>x.mobile==f.m.value&&x.pw==f.p.value);if(!u)return toast(H('मोबाइल या पासवर्ड गलत है','Wrong mobile or password'));S.user={mobile:u.mobile,name:u.name,city:u.city,pin:u.pin};after()}
function rgC0(f){if(f.p.value!=f.p2.value)return toast('Passwords do not match');if(S.users.some(x=>x.mobile==f.m.value))return toast(H('यह मोबाइल पहले से रजिस्टर है','Mobile already registered'));S.users.push({mobile:f.m.value,name:f.n.value,email:f.e.value,pw:f.p.value,city:f.c.value,pin:f.pin.value});S.user={mobile:f.m.value,name:f.n.value,city:f.c.value,pin:f.pin.value};after()}
function after(){const r=S.ret;S.ret=null;S.guest=0;save();R=r||['home'];draw()}
function lgS0(f){const u=S.staff.find(x=>x.id.toLowerCase()==f.i.value.trim().toLowerCase()&&x.pw==f.p.value);if(!u)return toast('Wrong ID or password');S.staffUser={id:u.id,name:u.name,role:u.role,branch:u.branch};S.user=null;save();go('admin','od')}
function cpw0(f){const u=S.staff.find(x=>x.id==S.staffUser.id);if(u.pw!=f.o.value)return toast('Current password is wrong');u.pw=f.n.value;save();toast('Password updated ✓');f.reset()}
function aB(f){S.branches.push({id:uid(),en:f.n.value});save();toast('Branch added');draw()}
function aS0(f){if(S.staff.some(x=>x.id==f.i.value.trim()))return toast('Login ID already exists');S.staff.push({id:f.i.value.trim(),pw:f.p.value,role:'branch',branch:f.b.value,name:f.n.value});save();toast('Login created ✓');draw()}

const FB=typeof firebase!='undefined'&&!FBCFG.apiKey.startsWith('YOUR');
let auth,db,sec,catReady=0,catExists=0,regBusy=0,subs=[];

function cpw(f){if(!FB)return cpw0(f);const u=auth.currentUser;u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,f.o.value)).then(()=>u.updatePassword(f.n.value)).then(()=>{toast('Password updated ✓');f.reset()}).catch(e=>toast(/password|credential/.test(e.code)?'Current password is wrong':e.message))}

function rp(i){if(!FB)return rp0(i);toast('Password reset: Firebase Console > Authentication, or delete and recreate this login')}
function watch(st){const q=c=>{let r=db.collection(c);r=st?(st.role=='super'?r:r.where('branch','==',st.branch)):r.where('uid','==',auth.currentUser.uid);
subs.push(r.onSnapshot(sn=>{S[c]=sn.docs.map(x=>({...x.data(),_id:x.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));rd()},e=>toast(c+': '+e.code)))};
['orders','appts','records','diets'].forEach(q);
if(st&&st.role=='super')subs.push(db.collection('staff').onSnapshot(sn=>{S.staff=sn.docs.map(x=>({...x.data(),uid:x.id}));rd()}))}
async function onAuth(u){if(regBusy)return;subs.forEach(f=>f());subs=[];['orders','appts','records','diets'].forEach(c=>S[c]=[]);
if(!u){S.user=null;S.staffUser=null;return draw()}
try{const st=await db.collection('staff').doc(u.uid).get();
if(st.exists){const d=st.data();S.staffUser={id:d.id,name:d.name,role:d.role,branch:d.branch,uid:u.uid};S.user=null;watch(d);if(d.role=='super'&&catReady&&!catExists)catSave();go('admin','od')}
else{const us=await db.collection('users').doc(u.uid).get();if(!us.exists){toast('Account not found');return auth.signOut()}S.user={...us.data(),uid:u.uid};S.staffUser=null;watch(null);after()}
}catch(e){toast('Error: '+e.code)}}

auth.onAuthStateChanged(onAuth)}
